components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: number
  schemas:
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status: *a1
    Error:
      type: object
      required:
        - error
      properties:
        error: *a1
        details:
          type: array
          items: *a1
    Ok:
      type: object
      required:
        - ok
      properties:
        ok: *a3
    CurrentUser:
      type: object
      required:
        - id
        - name
        - role
      properties:
        id: *a2
        name: *a1
        email: *a1
        role:
          type: string
          enum:
            - woman
            - employer
            - admin
        phone: *a1
        employerId: *a2
        employerVerificationStatus:
          type: string
          enum:
            - Pending
            - Verified
            - Rejected
    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email: *a1
        password: *a1
    RegisterWomanInput:
      type: object
      required:
        - role
        - name
        - email
        - phone
        - password
        - city
      properties:
        role:
          type: string
          enum:
            - woman
        name: *a1
        email: *a1
        phone: *a1
        password:
          type: string
          minLength: 8
        city: *a1
        area: *a1
        education: *a1
        employmentStatus: *a1
        skills:
          type: array
          items:
            type: object
            required:
              - name
            properties:
              name: *a1
              level: *a1
              yearsExperience: *a2
        interests: &a4
          type: array
          items: *a1
        workPreferences: *a4
        availability: *a1
        goal: *a1
    RegisterEmployerInput:
      type: object
      required:
        - role
        - businessName
        - employerName
        - email
        - phone
        - location
        - businessType
        - verificationInfo
        - password
      properties:
        role:
          type: string
          enum:
            - employer
        businessName: *a1
        employerName: *a1
        email: *a1
        phone: *a1
        location: *a1
        businessType: *a1
        description: *a1
        verificationInfo: *a1
        evidenceUrl: *a1
        password:
          type: string
          minLength: 8
    RegisterInput:
      oneOf:
        - $ref: "#/components/schemas/RegisterWomanInput"
        - $ref: "#/components/schemas/RegisterEmployerInput"
      discriminator:
        propertyName: role
    DemoAccounts:
      type: object
      required:
        - enabled
        - accounts
      properties:
        enabled: *a3
        accounts:
          type: array
          items:
            type: object
            required:
              - role
              - label
              - email
            properties:
              role: *a1
              label: *a1
              email: *a1
              password: *a1
    AiStatus:
      type: object
      required:
        - enabled
        - label
      properties:
        enabled: *a3
        label: *a1
    Skill:
      type: object
      required:
        - id
        - skillId
        - name
        - category
        - level
        - verified
        - verificationStatus
        - yearsExperience
        - improvement
      properties:
        id: *a2
        skillId: *a2
        name: *a1
        category: *a1
        level: *a1
        verified: *a3
        verificationStatus:
          type: string
          enum:
            - Not Verified
            - Pending Review
            - Verified
            - Rejected
        yearsExperience: *a2
        evidenceType:
          type:
            - string
            - "null"
        evidenceUrl:
          type:
            - string
            - "null"
        evidenceNote:
          type:
            - string
            - "null"
        reviewNotes:
          type:
            - string
            - "null"
        improvement: *a1
        assessmentCourseId:
          type:
            - number
            - "null"
        recommendedCourse:
          oneOf:
            - type: object
              required:
                - id
                - title
              properties:
                id: *a2
                title: *a1
            - type: "null"
    SkillInput:
      type: object
      required:
        - name
        - level
      properties:
        name: *a1
        level: *a1
        yearsExperience: *a2
    SkillUpdateInput:
      type: object
      required: []
      properties:
        level: *a1
        yearsExperience: *a2
    SkillEvidenceInput:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - Certificate
            - Portfolio
            - Work sample
            - Experience document
        url: *a1
        note: *a1
    SkillCatalogItem:
      type: object
      required:
        - id
        - name
        - category
      properties:
        id: *a2
        name: *a1
        category: *a1
    SkillAssessmentOverview:
      type: object
      required:
        - skillId
        - skillName
        - verificationStatus
        - attempts
      properties:
        skillId: *a2
        skillName: *a1
        verificationStatus: *a1
        courseId:
          type:
            - number
            - "null"
        courseTitle:
          type:
            - string
            - "null"
        attempts: *a2
        bestScore:
          type:
            - number
            - "null"
    Profile:
      type: object
      required:
        - name
        - city
        - goal
        - completion
        - readiness
        - availability
        - workPreferences
        - skills
        - verifiedSkills
        - readyFor
        - developNext
      properties:
        name: *a1
        email: *a1
        phone: *a1
        city: *a1
        area: *a1
        education: *a1
        employmentStatus: *a1
        interests: *a4
        goal: *a1
        experienceNotes: *a1
        completion: *a2
        readiness: *a2
        availability: *a1
        workPreferences: *a4
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"
        verifiedSkills: *a4
        readyFor: *a4
        developNext: *a4
        readinessLevel: *a1
    ProfileInput:
      type: object
      required: []
      properties:
        name: *a1
        phone: *a1
        city: *a1
        area: *a1
        education: *a1
        employmentStatus: *a1
        interests: *a4
        goal: *a1
        availability: *a1
        workPreferences: *a4
        experienceNotes: *a1
    Lesson:
      type: object
      required:
        - id
        - position
        - title
        - description
        - videoUrl
        - durationMinutes
        - content
        - objectives
        - resources
        - completed
      properties:
        id: *a2
        position: *a2
        title: *a1
        description: *a1
        videoUrl:
          type:
            - string
            - "null"
        durationMinutes: *a2
        content: *a1
        objectives: *a4
        resources:
          type: array
          items:
            type: object
            required:
              - title
              - url
            properties:
              title: *a1
              url: *a1
        completed: *a3
    Question:
      type: object
      required:
        - id
        - position
        - type
        - prompt
        - options
        - skillName
      properties:
        id: *a2
        position: *a2
        type:
          type: string
          enum:
            - multiple_choice
            - true_false
            - short_answer
        prompt: *a1
        options: *a4
        skillName:
          type:
            - string
            - "null"
    AssessmentAttempt:
      type: object
      required:
        - id
        - kind
        - attempt
        - score
        - passed
        - createdAt
      properties:
        id: *a2
        kind:
          type: string
          enum:
            - course
            - skill_check
        attempt: *a2
        score: *a2
        passed: *a3
        createdAt: *a1
    Certificate:
      type: object
      required:
        - id
        - code
        - courseId
        - courseTitle
        - skills
        - score
        - issuedAt
        - holderName
        - wording
        - disclaimer
      properties:
        id: *a2
        code: *a1
        courseId: *a2
        courseTitle: *a1
        skills: *a4
        score: *a2
        issuedAt: *a1
        holderName: *a1
        wording: *a1
        disclaimer: *a1
    Course:
      type: object
      required:
        - id
        - title
        - category
        - difficulty
        - duration
        - description
        - skillsGained
        - verifiesSkills
        - lessonCount
        - passingScore
        - progress
        - status
        - passed
      properties:
        id: *a2
        title: *a1
        category: *a1
        difficulty: *a1
        duration: *a1
        description: *a1
        skillsGained: *a4
        verifiesSkills: *a4
        lessonCount: *a2
        passingScore: *a2
        progress: *a2
        status:
          type: string
          enum:
            - not_started
            - in_progress
            - completed
        passed: *a3
    CourseDetail:
      type: object
      required:
        - id
        - title
        - category
        - difficulty
        - duration
        - description
        - skillsGained
        - verifiesSkills
        - lessonCount
        - passingScore
        - progress
        - status
        - passed
        - lessons
        - questions
        - attempts
        - certificate
        - assessmentReady
        - aiFeedbackAvailable
      properties:
        id: *a2
        title: *a1
        category: *a1
        difficulty: *a1
        duration: *a1
        description: *a1
        skillsGained: *a4
